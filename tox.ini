[tox]
skipsdist=True
envlist = pep8,py312

[testenv]
allowlist_externals =
    pycodestyle
    flake8
setenv = VIRTUAL_ENV={envdir}
         PYTHONWARNINGS=default::DeprecationWarning
deps =
    -r{toxinidir}/requirements.txt
    -r{toxinidir}/test-requirements.txt
    -e .
commands =
    {envpython} {toxinidir}/manage.py test --settings=researcher_workspace.test.settings --exclude-tag selenium {posargs}


[testenv:selenium]
passenv = DISPLAY
          TMPDIR
          GH_TOKEN
commands =
    {envpython} {toxinidir}/manage.py test --settings=researcher_workspace.test.settings --tag selenium {posargs}


[testenv:devenv]
envdir = devenv
usedevelop = True
commands =

[testenv:manage]
commands = {envpython} {toxinidir}/manage.py {posargs}

[testenv:pep8]
allowlist_externals =
    python
    pycodestyle
deps =
    pep8
    hacking>=6.0
commands = pycodestyle guacamole researcher_desktop researcher_workspace vm_manager

[testenv:flake8]
deps =
    flake8
    hacking>=6.0
commands = flake8 --jobs 1 guacamole researcher_desktop researcher_workspace vm_manager

[pycodestyle]
exclude = *settings.py,*settings_template.py,FoR_codes.py
ignore = E126,E127,E128,E131,W503

[flake8]
exclude = *settings.py,*settings_template.py,FoR_codes.py
ignore = E126,E127,E128,E131,W503,H102,H301

[testenv:cover]
commands =
    coverage erase
    coverage run --parallel-mode {toxinidir}/manage.py test --settings=researcher_workspace.test.settings --exclude-tag selenium {posargs}
    coverage combine
    # Generate a new HTML report with the combined results
    # otherwise the HTML report will only show partial results
    coverage html -d cover
    coverage xml -o cover/coverage.xml
    coverage report --skip-covered --fail-under=90

